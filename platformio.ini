[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
  +<main.cpp>
  -<diagnostics/>

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags =
  -Wall
  -Wextra

[env:hardware_diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
  -<*>
  +<diagnostics/hardware_diagnostic.cpp>

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/DHT sensor library@^1.4.6

build_flags =
  -Wall
  -Wextra
